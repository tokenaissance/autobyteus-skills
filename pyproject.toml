[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-audio-editing"
version = "0.2.0"
description = "Portable agent skill and CLI for ffmpeg video/audio editing with a retained thin MCP adapter"
authors = [{name = "AutoByteus"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "mcp>=1.28.1",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
video-audio = "video_audio.cli:main"
video-audio-mcp-server = "video_audio.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "requires_ffmpeg: needs real ffmpeg/ffprobe on PATH (skipped when absent)",
    "integration: crosses packaged process boundaries",
]
